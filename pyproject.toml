[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcco-sim"
version = "0.1.0"
description = "Numerics of the MCCO revision (simulation_plan.md), built on the TrOMA library"
requires-python = ">=3.11"          # TrOMA uses enum.StrEnum
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    # TrOMA, branch perf/vectorized-marginals (vectorized sketch marginals, sparse ExplicitSketchMap
    # sketching, DitString.from_integers, fallbacks). The installed commit is recorded in every run.
    "troma @ git+https://github.com/baptistechev/TrOMA.git@perf/vectorized-marginals",
]

[project.optional-dependencies]
plots = ["matplotlib==3.11.2", "pandas==2.3.3"]   # plot.py
test = ["pytest", "mcco-sim[plots]"]

[tool.setuptools]
packages = ["mcco_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # plot.py and run.py live at the repository root
